# Standalone: this example is built on its own, not as part of the root workspace.
[workspace]

[package]
name = "rilot-plugin-example"
version = "0.1.0"
edition = "2021"
description = "Example Wasm plugin for Rilot: per-route backend override and energy/carbon accounting."
license = "MIT"
repository = "https://github.com/SudoDevStudio/rilot"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
http = "0.2"
wasi-http-client = "0.2.1"
wit-component = "0.229.0"
wit-bindgen = { version = "0.41.0", features = ["macros"] }
log = "0.4"

# Metadata needed by cargo-component
[package.metadata.component.target]
path = "interface.wit"
world = "rilot-override"
