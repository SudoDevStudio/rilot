<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f1c22" />
  <rect x="0" y="0" width="600" height="630" fill="#fbfaf7" />
  <text x="64" y="150" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="58" font-weight="700" fill="#16242b">GreenCart</text>
  <text x="64" y="215" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="30" fill="#5d7079">A shop where every page</text>
  <text x="64" y="258" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="30" fill="#5d7079">is a routing decision.</text>
  <text x="64" y="360" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#197d76">GET /reports/monthly</text>
  <text x="664" y="150" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="26" letter-spacing="3" fill="#94aab3">LIVE ROUTING</text>
  <text x="664" y="215" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="44" font-weight="700" fill="#e8f1f4">Rilot picks the</text>
  <text x="664" y="268" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="44" font-weight="700" fill="#7fe0d3">cleanest region</text>
  <text x="664" y="340" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#94aab3">dublin · 134 g/kWh · selected</text>
  <text x="664" y="384" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#94aab3">east   · 305 g/kWh</text>
  <text x="664" y="428" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#94aab3">west   · 178 g/kWh</text>
  <text x="664" y="540" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="24" fill="#5d7079">rilot-core, compiled to WebAssembly</text>
