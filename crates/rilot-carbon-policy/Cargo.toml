[package]
name = "rilot-carbon-policy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure carbon cache policy: what to serve, what to fetch, what to refresh. No I/O, compiles to wasm32."
repository = "https://github.com/SudoDevStudio/rilot"

# Must stay pure like rilot-core: no HTTP, no clocks, no filesystem.
[dependencies]
rilot-core = { path = "../rilot-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
